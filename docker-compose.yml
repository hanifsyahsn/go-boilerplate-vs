services:
  postgres:
    image: postgres:17
    container_name: go_boilerplate_vs_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_LOCAL_PORT}:${DB_PORT}"
    restart: unless-stopped
    volumes:
      - go_boilerplate_vs_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Run the migrations first (`make migrate_up`), then:
  #   docker compose --profile app up -d --build
  app:
    profiles: ["app"]
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    container_name: go_boilerplate_vs_api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DB_SOURCE: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:${DB_PORT}/${DB_NAME}?sslmode=disable
    volumes:
      - ./internal/platform/config/ec-private.pem:/app/internal/platform/config/ec-private.pem:ro
      - ./internal/platform/config/ec-public.pem:/app/internal/platform/config/ec-public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  go_boilerplate_vs_db_data:
